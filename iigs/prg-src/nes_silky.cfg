MEMORY {

    ZP:  start = $20, size = $e0, type = rw, define = yes;

    # 32K NES PRG at $8000-$FFFF: code, rodata, data load, vectors
    ROM0: start = $8000, size = $7ffa, file = %O, fill = yes, define = yes;

    # Hardware vectors at the end of the PRG
    ROMV: start = $fffa, size = $6, file = %O, fill = yes;

    # C software stack / BSS.  The support code in the ROMBase bank starts at
    # $0800, so the C stack top is $0800 and grows down.
    RAM: start = $0300, size = $0500, define = yes;
}

SEGMENTS {
    STARTUP:  load = ROM0, type = ro, define = yes;
    LOWCODE:  load = ROM0, type = ro, optional = yes;
    INIT:     load = ROM0, type = ro, define = yes, optional = yes;
    CODE:     load = ROM0, type = ro, define = yes;
    RODATA:   load = ROM0, type = ro, define = yes;
    DATA:     load = ROM0, run = RAM, type = rw, define = yes;
    ONCE:     load = ROM0, type = ro, optional = yes;
    VECTORS:  load = ROMV, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
    HEAP:     load = RAM, type = bss, optional = yes;
    ZEROPAGE: load = ZP, type = zp;
}

FEATURES {
    CONDES: segment = INIT,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
            type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__;
    CONDES: type = interruptor,
            segment = RODATA,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0500;
}
