# X16 loader stub config: a $0801 PRG with the load-address header emitted
# from loader.s itself (no cc65 runtime is linked).
FEATURES {
    STARTADDRESS: default = $0801;
}
MEMORY {
    LOADADDR: file = %O, start = %S - 2, size = $0002, type = ro;
    RAM:      start = %S, size = $0400, type = rw, file = %O, fill = yes;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = RAM, type = ro;
    CODE:     load = RAM, type = ro;
}
