# X16 music-overlay linker config (spike).
# Derived from vera/src/a2vera/music_ftm.cfg; the overlay is loaded at $1000
# and its entry points are hardcoded at $1000-$1024 by music_imports_ftm.s.
FEATURES {
    STARTADDRESS: default = $1000;
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0140;
    __HIMEM__: type = weak, value = $1FFF;
    __STACKSTART__: type = weak, value = $95FF;
}
MEMORY {
    ZP:   start = $22, size = $5E, type = rw, file = "";
    LOADADDR: file = %O, start = %S - 2, size = $0002, type = ro;
    RAM:  start = $1000, size = __HIMEM__-$1000, type = rw, file = %O, fill = yes, define = yes;
    BSS:  start = $9200, size = $0100, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = RAM, type = ro;
    LOWCODE:  load = RAM, type = ro, optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw, define = yes;
    INIT:     load = RAM, type = rw, optional = yes;
    ASSETS:   load = RAM, type = ro;
    ONCE:     load = RAM, type = ro, define = yes;
    SFXDATA:  load = RAM, type = ro, start = $1C32;
    BSS:      load = BSS, type = bss, define = yes;
}
